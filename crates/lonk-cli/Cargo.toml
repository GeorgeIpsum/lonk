[package]
name = "lonk-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lonk"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
lonk-core = { path = "../lonk-core" }

[dev-dependencies]
tempfile = "3"
