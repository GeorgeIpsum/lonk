[package]
name = "lonk"
version = "0.1.0"
edition = "2021"

[dependencies]
rocket = { version = "0.5.1", features = ["json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.8"
lonk-validate = { path = "crates/lonk-validate" }

[dev-dependencies]
serde_json = "1"

[workspace]
members = ["crates/lonk-validate"]
